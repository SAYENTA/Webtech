<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <fieldset>
        <legend><b>Form</b></legend>
    <h3>Student Registration Form</h3>

    <form>

        <!--Text Box-->
        <label>Full Name:</label><br>
        <input type="Text" name="Fullname" placeholder="Enter Your Name"required><br><br>

        <!--Email-->
        <label>Email:</label><br>
        <input type="email" name="Email" placeholder="you@gmail.com"required><br><br>

        <!--Password-->
        <label>Password:</label><br>
        <input type="password" name="pass"required><br><br>

        <!--Number-->
        <label>Age:</label><br>
        <input type="number" name="Age" min="5" max="100"><br><br>

        <!--DOB-->
        <label>Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>

        <!--Gender-->
        <p>Gender:</p>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="Others"> Others
        <br><br>

        <!--City-->
        <label>City:</label><br>
        <select name="city">
            <option value="dhaka">Dhaka</option>
            <option value="khulna">Khulna</option>
            <option value="rajshahi">Rajshahi</option>
            <option value="Sylhet">Sylhet</option>
        </select>
        <br><br>

        <!--Hobby-->
        <p>Hobbies:</p>
        <input type="checkbox" name="hobby" value="reading"> Reading
        <input type="checkbox" name="hobby" value="cricket"> Cricket
        <input type="checkbox" name="hobby" value="music"> Music
        <br><br>

        <!--About-->
        <label>About Yourself:</label><br>
        <textarea name="about" rows="4" col="40"></textarea><br><br>

        <!--End-->
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
    </fieldset>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"d61ace1a7a5c47e3831d343de077b36a","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
